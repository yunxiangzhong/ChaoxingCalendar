<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试自定义协议</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #1890ff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 10px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #40a9ff;
        }
        .info {
            margin: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>测试自定义协议 cxcalendar://</h1>
    
    <div class="info">
        <h3>测试方法：</h3>
        <p>1. 点击下面的按钮，应该会启动 auto_homework.exe</p>
        <p>2. 如果弹出警告，请选择允许或信任</p>
        <p>3. 如果没有反应，请检查浏览器设置</p>
    </div>
    
    <!-- 使用不同的方式测试协议 -->
    <a href="cxcalendar://run" class="btn">方式1：直接链接</a>
    <button class="btn" onclick="window.location.href='cxcalendar://run'">方式2：JavaScript跳转</button>
    <button class="btn" onclick="window.open('cxcalendar://run', '_self')">方式3：window.open</button>
    
    <div class="info" style="margin-top: 30px;">
        <h3>浏览器设置检查：</h3>
        <p><strong>Chrome/Edge：</strong> 设置 → 隐私、搜索和服务 → 安全 → 不安全内容 → 允许</p>
        <p><strong>Firefox：</strong> 地址栏输入 about:config → network.protocol-handler.expose.cxcalendar → true</p>
        <p><strong>Windows 安全中心：</strong> 允许应用通过防火墙 → 确保浏览器被允许</p>
    </div>
    
    <script>
        // 添加错误处理
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'A' && e.target.href.startsWith('cxcalendar://')) {
                e.preventDefault();
                try {
                    window.location.href = e.target.href;
                    setTimeout(function() {
                        alert('协议调用成功！如果没有启动程序，请检查浏览器权限和防火墙设置。');
                    }, 1000);
                } catch (error) {
                    alert('协议调用失败：' + error.message);
                }
            }
        });
    </script>
</body>
</html>
